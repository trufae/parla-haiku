name: Haiku x86 (32-bit)
on:
  push:
    paths-ignore: ["README.md", "docs/**", ".github/workflows/haiku.yml", "tests/core_network.py", "tests/accounts_test.cpp", "tests/account_rpc.cpp"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haiku-x86-${{ github.ref }}
  cancel-in-progress: true
jobs:
  x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cross-build 32-bit GUI, core and hpkg
        run: |
          docker build -f .github/docker/x86.Dockerfile -t parla-haiku-x86 .github/docker
          docker run --rm -v "$PWD:/work" -w /work parla-haiku-x86 bash scripts/cross-x86.sh
      - name: Run 32-bit crypto stack ABI regression
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          python3 tests/x86_stack_alignment.py build-x86/core/target/i686-unknown-haiku/release/deltachat-rpc-server
      - uses: actions/upload-artifact@v4
        with:
          name: parla-haiku-x86
          path: dist/*-x86_gcc2.hpkg
          if-no-files-found: error
