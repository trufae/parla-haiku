name: Haiku x86 (32-bit)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haiku-x86-${{ github.ref }}
  cancel-in-progress: true
jobs:
  x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cross-build 32-bit GUI, core and hpkg
        run: |
          docker build -f .github/docker/x86.Dockerfile -t parla-haiku-x86 .github/docker
          docker run --rm -v "$PWD:/work" -w /work parla-haiku-x86 bash scripts/cross-x86.sh
      - uses: actions/upload-artifact@v4
        with:
          name: parla-haiku-x86
          path: dist/*-x86.hpkg
          if-no-files-found: error
