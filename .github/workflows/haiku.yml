name: Haiku
on:
  push:
    paths-ignore: ["README.md", "docs/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haiku-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Reproduce and fix Haiku poll backend lost wakeups
        run: bash scripts/test-runtime.sh
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Identify pinned core source
        id: core-source
        run: echo "revision=$(git -C subprojects/chatmail-core rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: core-cache
        with:
          path: core-artifact
          key: haiku-core64-${{ steps.core-source.outputs.revision }}-${{ hashFiles('.github/docker/x86.Dockerfile', 'scripts/build-core.sh', 'scripts/cross-x86_64-core.sh', 'scripts/patch-crates.py', 'patches/**', 'tests/runtime/**') }}
      - name: Cross-build x86_64 Chatmail core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          docker build -f .github/docker/x86.Dockerfile \
            --build-arg HAIKU_IMAGE=ghcr.io/haiku/cross-compiler:x86_64-r1beta5 \
            -t parla-haiku-core64 .github/docker
          docker run --rm -v "$PWD:/work" -w /work parla-haiku-core64 bash scripts/cross-x86_64-core.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chatmail-haiku-x86_64-core
          path: core-artifact/*
          if-no-files-found: error
  haiku:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: chatmail-haiku-x86_64-core
          path: build/core/target/release
      - name: Build and test native Haiku package
        uses: vmactions/haiku-vm@7e21b66d11ab20b9cf9a76331a9d18a4ce264527
        with:
          release: r1beta6
          arch: x86_64
          mem: 4096
          cpu: 4
          prepare: |
            set -eu
            pkgman install -y cmake ninja git openssl3 python3.11
          run: |
            set -eu
            chmod +x build/core/target/release/*
            build/core/target/release/parla-runtime-probe
            cmake -S . -B build/gui -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
            cmake --build build/gui -j4
            ctest --test-dir build/gui --output-on-failure
            python3.11 tests/core_smoke.py build/core/target/release/deltachat-rpc-server
            python3.11 tests/core_network.py build/core/target/release/deltachat-rpc-server
            sh scripts/package.sh
            pkgman install -y "$PWD"/dist/*-x86_64.hpkg
            sh tests/gui_smoke.sh
            cp build/gui/forms-native.png dist/parla-forms.png
            cp build/gui/diagnostics-native.png dist/parla-diagnostics.png
            cp build/gui/conversation-native.png dist/parla-conversation.png
      - uses: actions/upload-artifact@v4
        with:
          name: parla-haiku-x86_64
          path: |
            dist/*.hpkg
            dist/parla-native.png
            dist/parla-forms.png
            dist/parla-diagnostics.png
            dist/parla-conversation.png
          if-no-files-found: error
