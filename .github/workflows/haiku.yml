name: Haiku
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: haiku-${{ github.ref }}
  cancel-in-progress: true
jobs:
  haiku:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test native Haiku package
        uses: vmactions/haiku-vm@7e21b66d11ab20b9cf9a76331a9d18a4ce264527
        with:
          release: r1beta6
          arch: x86_64
          mem: 8192
          cpu: 4
          prepare: |
            set -eu
            pkgman install -y rust_bin cmake ninja git openssl3_devel pkgconfig python3.11 llvm21_lld llvm21_clang
          run: |
            set -eu
            rustc --version
            cmake -S . -B build/gui -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build/gui -j4
            ctest --test-dir build/gui --output-on-failure
            RUSTFLAGS="-C linker=clang -C link-arg=-fuse-ld=lld" PYTHON=python3.11 sh scripts/build-core.sh
            python3.11 tests/core_smoke.py build/core/target/release/deltachat-rpc-server
            sh scripts/package.sh
            sh tests/gui_smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: parla-haiku-x86_64
          path: dist/*.hpkg
          if-no-files-found: error
